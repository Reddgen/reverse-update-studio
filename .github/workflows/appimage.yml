name: Linux AppImage

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv patchelf wget
      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash linux/build_appimage.sh
      - name: Hash
        run: sha256sum reports/Reverse_Update_Studio-x86_64.AppImage | tee reports/AppImage.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: ReverseUpdateStudio-Linux-AppImage
          path: |
            reports/Reverse_Update_Studio-x86_64.AppImage
            reports/AppImage.sha256
